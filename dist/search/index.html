<div class="home">
  <h1 class="page-h1">全文检索</h1>
  <p class="page-lede">静态索引（Pagefind），构建期生成，无服务端。</p>
  <link href="/aicoding/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/aicoding/pagefind/pagefind-ui.js"></script>
  <div id="search"></div>
  <script>
  window.addEventListener('DOMContentLoaded', function(){
    new PagefindUI({ element: "#search", bundlePath: "/aicoding/pagefind/", baseUrl: "/aicoding/", showSubResults: true });
  });
  </script>
</div>
<script>
document.querySelectorAll('.prose pre').forEach(function(p){
  var w=document.createElement('div'); w.className='code-wrap';
  p.parentNode.insertBefore(w,p); w.appendChild(p);
  var b=document.createElement('button'); b.className='copy-btn'; b.textContent='复制';
  b.onclick=function(){ var t=p.innerText;
    var done=function(){ b.textContent='已复制'; setTimeout(function(){b.textContent='复制';},1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(fallback); } else { fallback(); }
    function fallback(){ var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
      try{document.execCommand('copy'); done();}catch(e){ b.textContent='复制失败'; } document.body.removeChild(a); }
  };
  w.appendChild(b);
});
</script>
</body>
</html>
