name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 产物由本地构建脚本生成后入库（含 mermaid 预渲染的 30 张 SVG），CI 只做校验与发布。
      # 构建工具在文档仓 project/aicoding/proto/：build-all.ps1（生成 + Pagefind 索引）。
      - name: 校验产物
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -d dist/pagefind || { echo "缺少 Pagefind 索引（先跑 build-all.ps1）"; exit 1; }
          pages=$(find dist -name 'index.html' | wc -l)
          echo "页面数：$pages"
          if [ "$pages" -lt 31 ]; then echo "页面数异常（应为 31+）"; exit 1; fi

      - name: 敏感词扫描
        run: python3 scripts/scan_sensitive.py

      # QA 第 1 关：静态结构（秒级，无依赖）——路由自动发现，不靠手写列表
      - name: QA · 静态结构
        run: python3 scripts/qa_pages.py local

      # QA 第 2 关：真浏览器（控制台/404/图渲染/搜索可点/横向溢出/移动端）
      - name: QA · 真浏览器
        run: |
          node scripts/serve-dist.cjs 4330 &
          sleep 2
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/qa_pages.py browser http://127.0.0.1:4330/aicoding

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
